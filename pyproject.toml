[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowhangingfruitme"
version = "0.2.0"
description = "Evidence-based supplier rebate audit kernel and optional source adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
import = ["frictionless>=5.0,<6"]
docs = ["docling>=2.70,<3"]
all = ["frictionless>=5.0,<6", "docling>=2.70,<3"]

[project.scripts]
lhfm = "lowhangingfruitme.intake_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
