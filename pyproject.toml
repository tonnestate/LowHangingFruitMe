[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowhangingfruitme"
version = "0.13.1"
description = "Evidence-based supplier rebate audit kernel and optional source adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
import = ["frictionless>=5.0,<6"]
docs = ["docling>=2.70,<3"]
registry = ["PyMySQL>=1.1,<2"]
auth = ["PyJWT[crypto]>=2.10,<3"]
universal = ["openpyxl>=3.1,<4", "defusedxml>=0.7,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "defusedxml>=0.7,<1", "reportlab>=4.2,<5"]
all = ["frictionless>=5.0,<6", "docling>=2.70,<3", "PyMySQL>=1.1,<2", "PyJWT[crypto]>=2.10,<3", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "reportlab>=4.2,<5"]

[project.scripts]
lhfm = "lowhangingfruitme.intake_cli:main"
lhfm-schema-check = "lowhangingfruitme.schema:main"
lhfm-migrate = "lowhangingfruitme.migrations:main"

[tool.setuptools.packages.find]
where = ["src"]
