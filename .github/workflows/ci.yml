name: Python quality checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-and-csv:
    name: Kernel and Frictionless (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with real Frictionless validator
        run: python -m pip install -e ".[import]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Existing kernel CLI smoke (unapproved calculation preview)
        run: |
          set +e
          python -m lowhangingfruitme.cli tests/fixtures/flat_rebate.json > /tmp/lhfm-preview.json
          status=$?
          set -e
          test "$status" -eq 1
          grep -q 'UNVERIFIED_APPROVAL_CONTEXT' /tmp/lhfm-preview.json
      - name: Generate ephemeral key for synthetic approval
        run: |
          python -c 'import os,secrets; open(os.environ["GITHUB_ENV"],"a").write("LHFM_APPROVAL_KEY_HEX="+secrets.token_hex(32)+"\n")'
      - name: Generate synthetic approval receipt in CI workspace
        run: |
          python tests/scripts/make_synthetic_approval.py \
            tests/fixtures/rule.json \
            tests/fixtures/synthetic_agreement.txt \
            /tmp/lhfm-ci-approval.json
      - name: Source import CLI smoke
        run: |
          lhfm audit-csv \
            --rule tests/fixtures/rule.json \
            --transactions tests/fixtures/transactions.csv \
            --settlements tests/fixtures/settlements.csv \
            --source-system erp \
            --controls tests/fixtures/source_controls.json \
            --approval /tmp/lhfm-ci-approval.json \
            --contract-source tests/fixtures/synthetic_agreement.txt \
            --tenant-id T-SYN-1 \
            --legal-entity-id LE-SYN-1 \
            --confirm-transactions-complete \
            --confirm-settlements-complete \
            --confirm-agreements-complete
      - name: Build installable distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Fresh wheel installation smoke
        run: |
          python -m venv /tmp/lowhangingfruitme-wheel
          /tmp/lowhangingfruitme-wheel/bin/python -m pip install dist/*.whl
          set +e
          /tmp/lowhangingfruitme-wheel/bin/python -m lowhangingfruitme.cli tests/fixtures/flat_rebate.json > /tmp/lhfm-wheel-preview.json
          status=$?
          set -e
          test "$status" -eq 1
          grep -q 'UNVERIFIED_APPROVAL_CONTEXT' /tmp/lhfm-wheel-preview.json
